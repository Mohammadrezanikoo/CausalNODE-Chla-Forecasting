[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sea-of-oman-chla-forecast"
version = "0.1.0"
description = "Research code for PCMCI-constrained Neural ODE marine chlorophyll-a forecasts"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3",
  "torch>=2.1", "optuna>=3.0", "matplotlib>=3.7"
]

[project.optional-dependencies]
causal = ["tigramite>=5.2"]
test = ["pytest>=7"]

[project.scripts]
chla-train = "chla_forecasting.pipeline:main"
chla-discover = "chla_forecasting.discovery:main"

[tool.setuptools.packages.find]
where = ["src"]
